<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aproveitamento de Área - Preenchimento por Linhas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    .input-group input, .input-group select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .button-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button.export-btn {
      background-color: #28a745;
    }
    button.export-btn:hover {
      background-color: #218838;
    }
    .stats {
      margin-bottom: 20px;
      font-weight: bold;
      background: #e9ecef;
      padding: 10px 15px;
      border-radius: 4px;
    }
    #canvas-container {
      overflow: auto;
      background: #e0e0e0;
      background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #ccc 75%), 
                        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      padding: 20px;
      border-radius: 8px;
    }
    canvas {
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>Aproveitamento de Área (Preenchimento Horizontal em Linhas)</h2>

  <div class="controls">
    <div class="input-group">
      <label>Imagem (Upload):</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="input-group">
      <label>Largura do Painel (cm):</label>
      <input type="number" id="panelW" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Altura do Painel (cm):</label>
      <input type="number" id="panelH" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Largura da Imagem (cm):</label>
      <input type="number" id="imgW" value="15" step="0.1" min="0.1">
    </div>
    <div class="input-group">
      <label>Altura da Imagem (cm):</label>
      <input type="number" id="imgH" value="10" step="0.1" min="0.1" disabled style="background:#eee;">
    </div>
    <div class="input-group">
      <label>Espaçamento entre imagens (cm):</label>
      <input type="number" id="spacing" value="0.5" step="0.1" min="0">
    </div>
    <div class="input-group">
      <label>Orientação da Imagem:</label>
      <select id="orientationMode">
        <option value="auto">Automática (Qual couber mais por linha)</option>
        <option value="original">Original (Sem rotação)</option>
        <option value="rotate">Rotacionar 90°</option>
      </select>
    </div>
    <div class="button-group">
      <button onclick="calculateAndDraw()">1. Calcular e Visualizar</button>
      <button class="export-btn" onclick="exportPNG()">2. Baixar PNG (Transparente)</button>
      <button class="export-btn" onclick="exportPDF()">3. Baixar PDF</button>
    </div>
  </div>

  <div class="stats" id="stats">Faça o upload de uma imagem para começar.</div>

  <div id="canvas-container">
    <canvas id="previewCanvas"></canvas>
  </div>

  <script>
    let rawImage = null;
    let upscaledImage = null;
    let originalAspectRatio = 1;
    let currentPlacedData = [];

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        rawImage = new Image();
        rawImage.onload = function() {
          originalAspectRatio = rawImage.width / rawImage.height;
          updateImgHeight();
          generate4xUpscale(rawImage);
        };
        rawImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('imgW').addEventListener('input', updateImgHeight);

    function updateImgHeight() {
      const w = parseFloat(document.getElementById('imgW').value);
      if (w && originalAspectRatio) {
        const h = w / originalAspectRatio;
        document.getElementById('imgH').value = h.toFixed(2);
      }
    }

    function generate4xUpscale(img) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = img.width * 4;
      offCanvas.height = img.height * 4;
      const ctx = offCanvas.getContext('2d');

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, offCanvas.width, offCanvas.height);

      upscaledImage = new Image();
      upscaledImage.src = offCanvas.toDataURL('image/png');
    }

    function calculateAndDraw() {
      if (!upscaledImage) {
        alert("Por favor, selecione uma imagem primeiro.");
        return;
      }

      const pW = parseFloat(document.getElementById('panelW').value);
      const pH = parseFloat(document.getElementById('panelH').value);
      const iW = parseFloat(document.getElementById('imgW').value);
      const iH = parseFloat(document.getElementById('imgH').value);
      const gap = parseFloat(document.getElementById('spacing').value);
      const mode = document.getElementById('orientationMode').value;

      if (!pW || !pH || !iW || !iH) return;

      // Executa o algoritmo de preenchimento em linha
      currentPlacedData = packRowByRow(pW, pH, iW, iH, gap, mode);

      renderCanvas(document.getElementById('previewCanvas'), pW, pH, currentPlacedData, false);

      const totalArea = pW * pH;
      const usedArea = currentPlacedData.length * (iW * iH);
      const efficiency = ((usedArea / totalArea) * 100).toFixed(1);

      document.getElementById('stats').innerText = 
        `Total de imagens encaixadas: ${currentPlacedData.length} unidade(s) | Aproveitamento da área: ${efficiency}%`;
    }

    // Algoritmo que preenche na Horizontal primeiro, depois desce na Vertical
    function packRowByRow(mW, mH, iW, iH, gap, mode) {
      let placed = [];
      let rotate = false;

      // Define se vai rotacionar com base no modo selecionado
      if (mode === 'rotate') {
        rotate = true;
      } else if (mode === 'auto') {
        // Calcula quantas cabem na largura sem rotacionar vs rotacionado
        const fitNormal = Math.floor((mW + gap) / (iW + gap));
        const fitRotated = Math.floor((mW + gap) / (iH + gap));
        if (fitRotated > fitNormal) {
          rotate = true;
        }
      }

      const actualW = rotate ? iH : iW;
      const actualH = rotate ? iW : iH;

      let currentY = 0;

      // Enquanto couber na altura (vertical)
      while (currentY + actualH <= mH) {
        let currentX = 0;

        // Preenche totalmente na largura (horizontal)
        while (currentX + actualW <= mW) {
          placed.push({
            x: currentX,
            y: currentY,
            w: actualW,
            h: actualH,
            rotated: rotate
          });

          // Avança para a próxima coluna horizontal
          currentX += actualW + gap;
        }

        // Quando a linha enche, avança para a próxima linha vertical
        currentY += actualH + gap;
      }

      return placed;
    }

    function renderCanvas(canvas, pW, pH, placedItems, isExporting = false) {
      const ctx = canvas.getContext('2d');
      
      let scale = 10;
      if (!isExporting) {
        const maxCanvasDim = 800;
        scale = Math.min(maxCanvasDim / pW, maxCanvasDim / pH);
      } else {
        scale = 30;
      }

      canvas.width = pW * scale;
      canvas.height = pH * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      placedItems.forEach(item => {
        ctx.save();
        ctx.translate((item.x + item.w / 2) * scale, (item.y + item.h / 2) * scale);
        if (item.rotated) {
          ctx.rotate(Math.PI / 2);
        }
        
        const renderW = (item.rotated ? item.h : item.w) * scale;
        const renderH = (item.rotated ? item.w : item.h) * scale;
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(upscaledImage, -renderW / 2, -renderH / 2, renderW, renderH);

        if (!isExporting) {
          ctx.strokeStyle = "rgba(0,0,0,0.2)";
          ctx.lineWidth = 1;
          ctx.strokeRect(-renderW / 2, -renderH / 2, renderW, renderH);
        }
        ctx.restore();
      });
    }

    function exportPNG() {
      if (currentPlacedData.length === 0) {
        alert("Gere o layout antes de exportar.");
        return;
      }
      const pW = parseFloat(document.getElementById('panelW').value);
      const pH = parseFloat(document.getElementById('panelH').value);

      const exportCanvas = document.createElement('canvas');
      renderCanvas(exportCanvas, pW, pH, currentPlacedData, true);

      const link = document.createElement('a');
      link.download = 'layout-imagens-linhas.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }

    function exportPDF() {
      if (currentPlacedData.length === 0) {
        alert("Gere o layout antes de exportar.");
        return;
      }

      const pW = parseFloat(document.getElementById('panelW').value);
      const pH = parseFloat(document.getElementById('panelH').value);

      const exportCanvas = document.createElement('canvas');
      renderCanvas(exportCanvas, pW, pH, currentPlacedData, true);

      const imgData = exportCanvas.toDataURL('image/png');
      
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: pW > pH ? 'landscape' : 'portrait',
        unit: 'cm',
        format: [pW, pH]
      });

      pdf.addImage(imgData, 'PNG', 0, 0, pW, pH);
      pdf.save('layout-imagens-linhas.pdf');
    }
  </script>
</body>
</html>
