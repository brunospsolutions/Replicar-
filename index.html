<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aproveitamento de Área - Otimizador Inteligente com Rotação (300 DPI)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    .input-group input, .input-group select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    .image-list-container {
      grid-column: 1 / -1;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 15px;
      margin-top: 5px;
    }
    .image-item {
      display: grid;
      grid-template-columns: 60px 1fr 120px 120px 100px 40px;
      gap: 10px;
      align-items: center;
      background: #fff;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .image-item img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      background: #eee;
      border-radius: 4px;
    }
    .image-item .remove-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
    }

    .button-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    button.export-btn {
      background-color: #28a745;
    }
    button.export-btn:hover {
      background-color: #218838;
    }
    .stats {
      margin-bottom: 20px;
      font-weight: bold;
      background: #e9ecef;
      padding: 10px 15px;
      border-radius: 4px;
    }
    #canvas-container {
      overflow: auto;
      background: #e0e0e0;
      background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #ccc 75%), 
                        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      padding: 20px;
      border-radius: 8px;
    }
    canvas {
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>Aproveitamento Máximo de Área - Bin Packing com Rotação (300 DPI)</h2>

  <div class="controls">
    <div class="input-group">
      <label>Adicionar Imagens (Upload Múltiplo):</label>
      <input type="file" id="imageInput" accept="image/*" multiple>
    </div>
    <div class="input-group">
      <label>Largura do Painel (cm):</label>
      <input type="number" id="panelW" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Altura do Painel (cm):</label>
      <input type="number" id="panelH" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Espaçamento entre imagens (cm):</label>
      <input type="number" id="spacing" value="0.5" step="0.1" min="0">
    </div>
    <div class="input-group">
      <label>Permitir Rotação Individual (90°):</label>
      <select id="allowRotation">
        <option value="yes">Sim (Recomendado para máximo uso)</option>
        <option value="no">Não (Manter orientação original)</option>
      </select>
    </div>

    <div class="image-list-container">
      <strong>Fila de Arquivos Carregados:</strong>
      <div id="imageList" style="margin-top: 10px;">
        <span style="color: #777; font-size: 0.9em;">Nenhuma imagem adicionada.</span>
      </div>
    </div>

    <div class="button-group">
      <button onclick="calculateAndDraw()">1. Otimizar e Visualizar Layout</button>
      <button class="export-btn" onclick="exportPNG()">2. Baixar PNG (300 DPI)</button>
      <button class="export-btn" onclick="exportPDF()">3. Baixar PDF (300 DPI)</button>
    </div>
  </div>

  <div class="stats" id="stats">Adicione uma ou mais imagens para começar.</div>

  <div id="canvas-container">
    <canvas id="previewCanvas"></canvas>
  </div>

  <script>
    let imageItems = [];
    let currentPlacedData = [];
    const DPI_300_PX_PER_CM = 300 / 2.54;

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const rawImg = new Image();
          rawImg.onload = function() {
            const croppedCanvas = cropTransparentEdges(rawImg);
            const croppedImg = new Image();
            croppedImg.onload = function() {
              const aspectRatio = croppedImg.width / croppedImg.height;
              const defaultW = 15;
              const defaultH = defaultW / aspectRatio;

              imageItems.push({
                id: Date.now() + Math.random(),
                file: croppedImg,
                name: file.name,
                aspectRatio: aspectRatio,
                widthCm: defaultW,
                heightCm: defaultH,
                quantity: 0
              });

              renderImageList();
            };
            croppedImg.src = croppedCanvas.toDataURL('image/png');
          };
          rawImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });

      this.value = '';
    });

    function cropTransparentEdges(img) {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = img.width;
      tempCanvas.height = img.height;
      const ctx = tempCanvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, img.width, img.height);
      const data = imgData.data;

      let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
      let foundPixel = false;

      for (let y = 0; y < img.height; y++) {
        for (let x = 0; x < img.width; x++) {
          const alpha = data[(y * img.width + x) * 4 + 3];
          if (alpha > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            foundPixel = true;
          }
        }
      }

      if (!foundPixel) return tempCanvas;

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = cropW;
      croppedCanvas.height = cropH;
      const croppedCtx = croppedCanvas.getContext('2d');
      croppedCtx.drawImage(tempCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

      return croppedCanvas;
    }

    function renderImageList() {
      const container = document.getElementById('imageList');
      if (imageItems.length === 0) {
        container.innerHTML = '<span style="color: #777; font-size: 0.9em;">Nenhuma imagem adicionada.</span>';
        return;
      }

      container.innerHTML = '';
      imageItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'image-item';
        div.innerHTML = `
          <img src="${item.file.src}">
          <span style="font-size:0.85em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${item.name}">${item.name}</span>
          <div class="input-group">
            <label style="font-size:0.75em;">Largura (cm):</label>
            <input type="number" value="${item.widthCm.toFixed(2)}" step="0.1" min="0.1" onchange="updateItemWidth(${index}, this.value)">
          </div>
          <div class="input-group">
            <label style="font-size:0.75em;">Altura (cm):</label>
            <input type="number" value="${item.heightCm.toFixed(2)}" step="0.1" min="0.1" onchange="updateItemHeight(${index}, this.value)">
          </div>
          <div class="input-group">
            <label style="font-size:0.75em;">Qtd (0 = Infinito):</label>
            <input type="number" value="${item.quantity}" min="0" onchange="updateItemQuantity(${index}, this.value)">
          </div>
          <button class="remove-btn" onclick="removeItem(${index})">X</button>
        `;
        container.appendChild(div);
      });
    }

    function updateItemWidth(index, val) {
      const w = parseFloat(val);
      if (w && w > 0) {
        imageItems[index].widthCm = w;
        imageItems[index].heightCm = w / imageItems[index].aspectRatio;
        renderImageList();
      }
    }

    function updateItemHeight(index, val) {
      const h = parseFloat(val);
      if (h && h > 0) {
        imageItems[index].heightCm = h;
        imageItems[index].widthCm = h * imageItems[index].aspectRatio;
        renderImageList();
      }
    }

    function updateItemQuantity(index, val) {
      const q = parseInt(val, 10);
      if (!isNaN(q) && q >= 0) {
        imageItems[index].quantity = q;
      }
    }

    function removeItem(index) {
      imageItems.splice(index, 1);
      renderImageList();
    }

    function calculateAndDraw() {
      if (imageItems.length === 0) {
        alert("Por favor, adicione pelo menos uma imagem.");
        return;
      }

      const pW = parseFloat(document.getElementById('panelW').value);
      const pH = parseFloat(document.getElementById('panelH').value);
      const gap = parseFloat(document.getElementById('spacing').value);
      const allowRotation = document.getElementById('allowRotation').value === 'yes';

      if (!pW || !pH) return;

      currentPlacedData = packMaxEfficiency(pW, pH, gap, allowRotation);

      renderCanvas(document.getElementById('previewCanvas'), pW, pH, currentPlacedData, false);

      const totalArea = pW * pH;
      let usedArea = 0;
      currentPlacedData.forEach(item => {
        usedArea += item.w * item.h;
      });
      const efficiency = ((usedArea / totalArea) * 100).toFixed(1);

      document.getElementById('stats').innerText = 
        `Total de imagens encaixadas: ${currentPlacedData.length} unidade(s) | Aproveitamento da área: ${efficiency}%`;
    }

    // Algoritmo Guilhotina 2D com Otimização de Lacunas e Rotação 90°
    function packMaxEfficiency(mW, mH, gap, allowRotation) {
      let freeRects = [{ x: 0, y: 0, w: mW, h: mH }];
      let placed = [];

      // Constrói lista de itens a serem posicionados
      let itemsToPack = [];
      let counts = imageItems.map(item => item.quantity);
      let loopCounter = 0;
      let maxLoop = 10000; // Limite de segurança

      while (loopCounter < maxLoop) {
        let addedInThisPass = 0;
        for (let i = 0; i < imageItems.length; i++) {
          const item = imageItems[i];
          if (item.quantity === 0 || counts[i] > 0) {
            itemsToPack.push({
              itemObj: item,
              w: item.widthCm,
              h: item.heightCm,
              area: item.widthCm * item.heightCm
            });
            if (item.quantity > 0) counts[i]--;
            addedInThisPass++;
          }
        }
        if (addedInThisPass === 0) break;
        // Se todas as imagens forem infinitas (quantity=0), roda o bastante para preencher
        if (imageItems.every(item => item.quantity === 0) && itemsToPack.length > 500) break;
        loopCounter++;
      }

      // Processa cada item procurando a melhor lacuna (Best Short Side Fit)
      for (let k = 0; k < itemsToPack.length; k++) {
        const item = itemsToPack[k];
        let bestRectIdx = -1;
        let bestRotated = false;
        let bestShortSideFit = Infinity;

        for (let i = 0; i < freeRects.length; i++) {
          let rect = freeRects[i];

          // Testa sem rotação
          if (item.w <= rect.w && item.h <= rect.h) {
            let leftover = Math.min(rect.w - item.w, rect.h - item.h);
            if (leftover < bestShortSideFit) {
              bestShortSideFit = leftover;
              bestRectIdx = i;
              bestRotated = false;
            }
          }

          // Testa com rotação 90° (se permitido)
          if (allowRotation && item.h <= rect.w && item.w <= rect.h) {
            let leftover = Math.min(rect.w - item.h, rect.h - item.w);
            if (leftover < bestShortSideFit) {
              bestShortSideFit = leftover;
              bestRectIdx = i;
              bestRotated = true;
            }
          }
        }

        // Se encontrou espaço livre adequado
        if (bestRectIdx !== -1) {
          let target = freeRects.splice(bestRectIdx, 1)[0];
          let actualW = bestRotated ? item.h : item.w;
          let actualH = bestRotated ? item.w : item.h;

          placed.push({
            x: target.x,
            y: target.y,
            w: actualW,
            h: actualH,
            rotated: bestRotated,
            imgObj: item.itemObj.file
          });

          // Subdivide a área restante em retângulos menores (Direita e Abaixo)
          let rightSpace = {
            x: target.x + actualW + gap,
            y: target.y,
            w: target.w - actualW - gap,
            h: actualH
          };

          let bottomSpace = {
            x: target.x,
            y: target.y + actualH + gap,
            w: target.w,
            h: target.h - actualH - gap
          };

          if (rightSpace.w > 0 && rightSpace.h > 0) freeRects.push(rightSpace);
          if (bottomSpace.w > 0 && bottomSpace.h > 0) freeRects.push(bottomSpace);

          // Ordena espaços livres para priorizar o preenchimento dos cantos mais altos
          freeRects.sort((a, b) => a.y - b.y || a.x - b.x);
        }
      }

      return placed;
    }

    function renderCanvas(canvas, pW, pH, placedItems, isExporting = false) {
      const ctx = canvas.getContext('2d');
      
      let scale;
      if (!isExporting) {
        const maxCanvasDim = 800;
        scale = Math.min(maxCanvasDim / pW, maxCanvasDim / pH);
      } else {
        scale = DPI_300_PX_PER_CM;
      }

      canvas.width = pW * scale;
      canvas.height = pH * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      placedItems.forEach(item => {
        ctx.save();
        ctx.translate((item.x + item.w / 2) * scale, (item.y + item.h / 2) * scale);
        
        if (item.rotated) {
          ctx.rotate(Math.PI / 2);
        }

        const renderW = (item.rotated ? item.h : item.w) * scale;
        const renderH = (item.rotated ? item.w : item.h) * scale;
        
        ctx.drawImage(item.imgObj, -renderW / 2, -renderH / 2, renderW, renderH);

        if (!isExporting) {
          ctx.strokeStyle = "rgba(0,0,0,0.2)";
          ctx.lineWidth = 1;
          ctx.strokeRect(-renderW / 2, -renderH / 2, renderW, renderH);
        }
        ctx.restore();
      });
    }

    function exportPNG() {
      if (currentPlacedData.length === 0) {
        alert("Gere o layout antes de exportar.");
        return;
      }

      document.getElementById('stats').innerText = "Processando imagem em alta resolução (300 DPI)... Aguarde um instante.";

      setTimeout(() => {
        const pW = parseFloat(document.getElementById('panelW').value);
        const pH = parseFloat(document.getElementById('panelH').value);

        const exportCanvas = document.createElement('canvas');
        renderCanvas(exportCanvas, pW, pH, currentPlacedData, true);

        const link = document.createElement('a');
        link.download = 'layout-otimizado-300dpi.png';
        link.href = exportCanvas.toDataURL('image/png');
        link.click();

        document.getElementById('stats').innerText = "Download concluído com sucesso!";
      }, 100);
    }

    function exportPDF() {
      if (currentPlacedData.length === 0) {
        alert("Gere o layout antes de exportar.");
        return;
      }

      document.getElementById('stats').innerText = "Gerando PDF em alta resolução (300 DPI)... Aguarde um instante.";

      setTimeout(() => {
        const pW = parseFloat(document.getElementById('panelW').value);
        const pH = parseFloat(document.getElementById('panelH').value);

        const exportCanvas = document.createElement('canvas');
        renderCanvas(exportCanvas, pW, pH, currentPlacedData, true);

        const imgData = exportCanvas.toDataURL('image/png');
        
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: pW > pH ? 'landscape' : 'portrait',
          unit: 'cm',
          format: [pW, pH]
        });

        pdf.addImage(imgData, 'PNG', 0, 0, pW, pH, '', 'FAST');
        pdf.save('layout-otimizado-300dpi.pdf');

        document.getElementById('stats').innerText = "Download do PDF concluído!";
      }, 100);
    }
  </script>
</body>
</html>
