<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aproveitamento de Espaço para Impressão / Corte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    .input-group input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      grid-column: 1 / -1;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .stats {
      margin-bottom: 20px;
      font-weight: bold;
      background: #e9ecef;
      padding: 10px 15px;
      border-radius: 4px;
    }
    #canvas-container {
      overflow: auto;
      background: #ccc;
      padding: 20px;
      border-radius: 8px;
    }
    canvas {
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>Calculador de Aproveitamento de Área</h2>

  <div class="controls">
    <div class="input-group">
      <label>Imagem (Upload):</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>
    <div class="input-group">
      <label>Largura do Painel (cm):</label>
      <input type="number" id="panelW" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Altura do Painel (cm):</label>
      <input type="number" id="panelH" value="100" min="1">
    </div>
    <div class="input-group">
      <label>Largura da Imagem (cm):</label>
      <input type="number" id="imgW" value="15" step="0.1" min="0.1">
    </div>
    <div class="input-group">
      <label>Altura da Imagem (cm):</label>
      <input type="number" id="imgH" value="10" step="0.1" min="0.1" disabled style="background:#eee;">
    </div>
    <div class="input-group">
      <label>Espaçamento entre imagens (cm):</label>
      <input type="number" id="spacing" value="0.5" step="0.1" min="0">
    </div>
    <button onclick="calculateAndDraw()">Calcular e Gerar Layout</button>
  </div>

  <div class="stats" id="stats">Faça o upload de uma imagem e clique em calcular.</div>

  <div id="canvas-container">
    <canvas id="previewCanvas"></canvas>
  </div>

  <script>
    let uploadedImage = null;
    let originalAspectRatio = 1;

    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImage = new Image();
        uploadedImage.onload = function() {
          originalAspectRatio = uploadedImage.width / uploadedImage.height;
          updateImgHeight();
        };
        uploadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('imgW').addEventListener('input', updateImgHeight);

    function updateImgHeight() {
      const w = parseFloat(document.getElementById('imgW').value);
      if (w && originalAspectRatio) {
        const h = w / originalAspectRatio;
        document.getElementById('imgH').value = h.toFixed(2);
      }
    }

    function calculateAndDraw() {
      if (!uploadedImage) {
        alert("Por favor, selecione uma imagem primeiro.");
        return;
      }

      const pW = parseFloat(document.getElementById('panelW').value);
      const pH = parseFloat(document.getElementById('panelH').value);
      const iW = parseFloat(document.getElementById('imgW').value);
      const iH = parseFloat(document.getElementById('imgH').value);
      const gap = parseFloat(document.getElementById('spacing').value);

      if (!pW || !pH || !iW || !iH) return;

      // Algoritmo de empacotamento com rotação
      const placed = packImages(pW, pH, iW, iH, gap);

      // Renderização no Canvas
      const canvas = document.getElementById('previewCanvas');
      const ctx = canvas.getContext('2d');

      // Escala para ajustar na tela mantendo proporção (1 cm = N pixels no canvas)
      const maxCanvasDim = 800;
      const scale = Math.min(maxCanvasDim / pW, maxCanvasDim / pH);

      canvas.width = pW * scale;
      canvas.height = pH * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      placed.forEach(item => {
        ctx.save();
        ctx.translate((item.x + item.w / 2) * scale, (item.y + item.h / 2) * scale);
        if (item.rotated) {
          ctx.rotate(Math.PI / 2);
        }
        
        // Desenha a imagem
        const renderW = (item.rotated ? item.h : item.w) * scale;
        const renderH = (item.rotated ? item.w : item.h) * scale;
        ctx.drawImage(uploadedImage, -renderW / 2, -renderH / 2, renderW, renderH);
        
        // Borda leve indicando o corte
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = 1;
        ctx.strokeRect(-renderW / 2, -renderH / 2, renderW, renderH);
        ctx.restore();
      });

      // Cálculo de estatísticas
      const totalArea = pW * pH;
      const usedArea = placed.length * (iW * iH);
      const efficiency = ((usedArea / totalArea) * 100).toFixed(1);

      document.getElementById('stats').innerText = 
        `Total de imagens encaixadas: ${placed.length} unidade(s) | Aproveitamento da área: ${efficiency}%`;
    }

    // Algoritmo de Guilhotina (Bin Packing) com suporte a rotação 90°
    function packImages(mW, mH, iW, iH, gap) {
      let freeRects = [{ x: 0, y: 0, w: mW, h: mH }];
      let placed = [];

      while (true) {
        let bestRectIdx = -1;
        let bestRotated = false;
        let bestShortSideFit = Infinity;

        // Encontra o melhor espaço livre para a próxima imagem
        for (let i = 0; i < freeRects.length; i++) {
          let rect = freeRects[i];

          // Testa Sem Rotação
          if (iW <= rect.w && iH <= rect.h) {
            let leftover = Math.min(rect.w - iW, rect.h - iH);
            if (leftover < bestShortSideFit) {
              bestShortSideFit = leftover;
              bestRectIdx = i;
              bestRotated = false;
            }
          }

          // Testa Com Rotação (90 graus)
          if (iH <= rect.w && iW <= rect.h) {
            let leftover = Math.min(rect.w - iH, rect.h - iW);
            if (leftover < bestShortSideFit) {
              bestShortSideFit = leftover;
              bestRectIdx = i;
              bestRotated = true;
            }
          }
        }

        if (bestRectIdx === -1) break; // Não cabe mais nada

        let target = freeRects.splice(bestRectIdx, 1)[0];
        let actualW = bestRotated ? iH : iW;
        let actualH = bestRotated ? iW : iH;

        placed.push({
          x: target.x,
          y: target.y,
          w: actualW,
          h: actualH,
          rotated: bestRotated
        });

        // Divisão de espaço restante (Guilhotina)
        let rightSpace = {
          x: target.x + actualW + gap,
          y: target.y,
          w: target.w - actualW - gap,
          h: target.h
        };

        let bottomSpace = {
          x: target.x,
          y: target.y + actualH + gap,
          w: actualW,
          h: target.h - actualH - gap
        };

        if (rightSpace.w > 0 && rightSpace.h > 0) freeRects.push(rightSpace);
        if (bottomSpace.w > 0 && bottomSpace.h > 0) freeRects.push(bottomSpace);
      }

      return placed;
    }
  </script>
</body>
</html>
